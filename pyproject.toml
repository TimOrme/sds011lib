[project]
name = "sds011lib"
version = "0.4.0"
description = "SDS011 Library"
authors = [{ name = "Tim Orme", email = "TimothyOrme@gmail.com" }]
requires-python = ">=3.8,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["pyserial>=3.5,<4"]

[dependency-groups]
dev = [
    "pytest>=7.3.1,<8",
    "ruff>=0.0.256,<0.0.257",
    "black>=23.1.0,<24",
    "mypy>=1.1.1,<2",
    "types-pyserial>=3.5.0.8,<4",
    "myst-parser>=1.0.0,<2",
    "mkdocs>=1.4.2,<2",
    "mkdocs-gitbook>=0.0.1,<0.0.2",
    "mkdocs-material>=9.1.8,<10",
    "mkdocstrings[python]>=0.21.2,<0.22",
    "tox>=4.5.1,<5",
    "pytest-cov>=4.0.0,<5",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
select = ["E", "F", "D"]
ignore = ["D203", "D213"]
line-length = 120

[tool.ruff.pydocstyle]
# Use Google-style docstrings.
convention = "google"

[tool.ruff.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104" ]  # We dont need docstrings in tests

[[tool.mypy.overrides]]
module = "serial.*"
ignore_missing_imports = true

