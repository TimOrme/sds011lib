[project]
name = "sds011lib"
version = "0.5.0"
description = "SDS011 Library"
authors = [{ name = "Tim Orme", email = "TimothyOrme@gmail.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["pyserial==3.*"]

[dependency-groups]
dev = [
    "pytest==9.*",
    "ruff==0.17.*",
    "mypy==2.*",
    "types-pyserial==3.*",
    "myst-parser==4.*",
    "mkdocs==1.*",
    "mkdocs-gitbook==0.0.*",
    "mkdocs-material==9.*",
    "mkdocstrings[python]==1.*",
    "tox==4.*",
    "pytest-cov==7.*",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings.
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "BLE001" ]  # We dont need docstrings in tests, and we have cases to catch all exceptions

[[tool.mypy.overrides]]
module = "serial.*"
ignore_missing_imports = true

