name: Release
on:
  push:
    tags:
      - "v*.*.*"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup just
        uses: extractions/setup-just@v1
      - uses: actions/setup-python@v4
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.1
      - name: Install dev dependencies
        run: just install_deps
      - name: Run tests
        run: just test
      - name: Build wheel
        run: uv build
      - run: uv run mkdocs gh-deploy --force --clean --verbose
      - name: Upload distributions as artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
  publish:
    needs:
       build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: false

      - name: Download distributions artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@v0.0.6

      - name: Publish
        run: uv publish